# MirrorGate: nginx + PHP-FPM example for ONE mirror instance (overload.ir mirroring
# overlord.team). Copy it per instance: one server block = one domain = one docroot =
# one .env = one STORAGE_DIR (see docs/multi-instance.md).
#
# Adjust: server_name, root, ssl_certificate paths, the PHP-FPM socket.
# Layout assumed:
#   /var/www/overload.ir/            project root (.env, src/, bin/, var/, ...)
#   /var/www/overload.ir/public/     docroot (this is `root` below)

# Drop requests for unknown hosts before they reach PHP (MirrorGate also validates Host).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Replace with any certificate; clients get a connection reset anyway.
    ssl_certificate     /etc/letsencrypt/live/overload.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/overload.ir/privkey.pem;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name overload.ir www.overload.ir;

    # ACME http-01 challenges are answered from the docroot, everything else upgrades.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/overload.ir/public;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name overload.ir www.overload.ir;

    ssl_certificate     /etc/letsencrypt/live/overload.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/overload.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/overload.ir/public;
    index index.php;

    # Keep equal to MAX_REQUEST_BODY_BYTES.
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    large_client_header_buffers 4 16k;

    # Do not collapse // in paths; the origin may care and MirrorGate normalizes itself.
    merge_slashes off;

    # MirrorGate compresses buffered responses itself. nginx gzip would buffer streams.
    gzip off;

    # Do not advertise the nginx version.
    server_tokens off;

    # --- Secrets and non-public files ------------------------------------------------------

    # Dotfiles (.env, .git, .htaccess, .user.ini ...). /.well-known/ stays reachable.
    location ~ /\.(?!well-known(/|$)) {
        return 403;
    }

    # Only needed when the docroot is the project root instead of public/ (root shim layout):
    # route project directories to MirrorGate instead of serving them from disk.
    # location ~ ^/(?:src|bin|var|templates|tests|docs|vendor|resources|tools|examples|public)(?:/|$) {
    #     rewrite ^ /index.php last;
    # }

    # --- Front controller ------------------------------------------------------------------

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        # REQUEST_URI from fastcgi_params is the raw request line URI, which is what
        # MirrorGate validates and forwards.
        fastcgi_param HTTP_PROXY      "";   # httpoxy
        # php://input must carry form and multipart bodies (see .user.ini).
        fastcgi_param PHP_VALUE       "enable_post_data_reading=0";

        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    120s;
        fastcgi_read_timeout    120s;
        fastcgi_buffer_size     16k;
        fastcgi_buffers         16 16k;

        # Server-Sent Events: MirrorGate sends "X-Accel-Buffering: no" on streamed responses
        # and nginx honours it. To disable buffering for the whole instance instead:
        # fastcgi_buffering off;
    }

    # Any other PHP file never runs; the path is treated like any proxied path.
    location ~* \.(?:php[0-9]*|phtml|phar|phps|inc|pht)$ {
        rewrite ^ /index.php last;
    }

    # Files served directly from disk: ACME / AutoSSL validation and an explicit static/ dir.
    location ~ ^/(?:\.well-known|static)/ {
        try_files $uri /index.php$is_args$args;
    }

    # Everything else is the mirrored site.
    location / {
        rewrite ^ /index.php last;
    }

    # --- WebSocket / gRPC / TCP / UDP (optional daemon) --------------------------------------
    # php-fpm cannot hold these sockets. Run bin/mirrorgate-daemon (see docs/daemon.md) with
    # DAEMON_LISTEN_1=ws://127.0.0.1:9001->wss://overlord.team:443 and set
    # WS_PUBLIC_URL=wss://overload.ir/ws in .env, then proxy that path here. Place the block
    # before "location /" is matched, a ^~ prefix location always wins over regex locations:
    #
    # location ^~ /ws {
    #     proxy_pass http://127.0.0.1:9001;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host       $host;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    #     proxy_buffering off;
    # }
    #
    # Raw TCP / UDP listeners are bound by the daemon itself (loopback by default). To expose
    # one publicly prefer binding the daemon to the public IP with DAEMON_ALLOW_PUBLIC_BIND,
    # or use nginx `stream {}` as an L4 front, which needs a separate top-level context.
}
