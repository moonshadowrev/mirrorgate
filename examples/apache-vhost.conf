# MirrorGate: Apache 2.4 + PHP-FPM (mod_proxy_fcgi) virtual host for ONE mirror instance
# (ormantek.com mirroring overlord.team). One virtual host = one domain = one docroot =
# one .env = one STORAGE_DIR (see docs/multi-instance.md).
#
# Required modules: rewrite, headers, setenvif, proxy, proxy_fcgi, ssl, http2 (optional),
# authz_core. Adjust: ServerName, paths, certificate files, the PHP-FPM socket.
#
# Layout assumed:
#   /var/www/ormantek.com/            project root (.env, src/, bin/, var/, ...)
#   /var/www/ormantek.com/public/     DocumentRoot
#
# The rules below are the same as public/.htaccess, inlined with AllowOverride None. That is
# faster and cannot be bypassed by a stray .htaccess; public/.htaccess then becomes inert.
# Under mod_php replace the SetHandler block with `php_value enable_post_data_reading 0`.

<VirtualHost *:80>
    ServerName ormantek.com
    ServerAlias www.ormantek.com

    # ACME http-01 validation stays on http, everything else upgrades.
    DocumentRoot /var/www/ormantek.com/public
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName ormantek.com
    ServerAlias www.ormantek.com
    DocumentRoot /var/www/ormantek.com/public

    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/ormantek.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ormantek.com/privkey.pem
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1

    # Percent-encoded slashes are legitimate in proxied URLs. Pass them on untouched instead
    # of answering 404. MirrorGate reads the raw REQUEST_URI and validates it itself.
    AllowEncodedSlashes NoDecode

    # Keep equal to MAX_REQUEST_BODY_BYTES (10 MiB).
    LimitRequestBody 10485760
    LimitRequestFields 100
    LimitRequestFieldSize 8190
    RequestReadTimeout header=15-30,MinRate=500 body=30,MinRate=500

    # httpoxy: never let a client "Proxy" header become HTTP_PROXY.
    RequestHeader unset Proxy early

    # Do not let mod_deflate buffer Server-Sent Events.
    SetEnvIfNoCase Accept "text/event-stream" no-gzip=1 dont-vary=1

    ErrorLog  ${APACHE_LOG_DIR}/ormantek.com-error.log
    CustomLog ${APACHE_LOG_DIR}/ormantek.com-access.log combined

    <Directory /var/www/ormantek.com/public>
        AllowOverride None
        Options -Indexes -MultiViews +FollowSymLinks
        DirectoryIndex index.php
        Require all granted

        # Pass the Authorization header through to PHP-FPM (Apache >= 2.4.13).
        CGIPassAuth On

        # Dotfiles, leftovers and every PHP file except index.php are never served.
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
        <FilesMatch "(?i)(~|\.(bak|backup|old|orig|save|swp|swo|tmp|dist|sql|log|ini|env|lock))$">
            Require all denied
        </FilesMatch>
        <FilesMatch "(?i)^(?!index\.php$).+\.(php[0-9]*|phtml|phar|phps|inc|pht)$">
            Require all denied
        </FilesMatch>

        # Front controller (identical to public/.htaccess).
        RewriteEngine On
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteRule (^|/)\.(?!well-known(/|$)) - [F,L]
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^(?:\.well-known|static)/(?!.*\.(?:php[0-9]*|phtml|phar|phps|inc|pht)(?:/|$)).+$ - [L,NC]
        RewriteRule ^ index.php [L]
    </Directory>

    # PHP-FPM. enable_post_data_reading=0 is required so php://input carries form and
    # multipart bodies (public/.user.ini does the same when .user.ini is honoured).
    <FilesMatch "^index\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>
    <Proxy "fcgi://localhost/">
        # flushpackets=on makes Apache pass streamed chunks (SSE) on immediately instead of
        # waiting to fill its buffer. Remove it if your build rejects the parameter.
        ProxySet flushpackets=on timeout=120
    </Proxy>
    ProxyFCGISetEnvIf "true" PHP_VALUE "enable_post_data_reading=0"

    # Keep the PHP and Apache identity quiet (also set ServerTokens Prod and TraceEnable Off
    # globally in apache2.conf).
    Header always unset X-Powered-By
</VirtualHost>
