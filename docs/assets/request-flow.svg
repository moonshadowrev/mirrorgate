<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
  <title id="t">MirrorGate request flow</title>
  <desc id="d">A request passes the guard, then the cache. A fresh hit is served directly. A miss or stale entry goes to the origin through the SSRF guarded client, is rewritten, stored and served. On origin failure a stale copy is served, otherwise a friendly error page.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#e2e8f0}
      .h{font-size:15px;font-weight:700} .s{font-size:12px;fill:#94a3b8}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#cbd5e1}
      .box{fill:#111a2e;stroke:#243049;stroke-width:1.5} .hl{fill:#0f1f2e;stroke:url(#g);stroke-width:2}
      .ok{fill:#0f2a24;stroke:#2dd4bf;stroke-width:1.5} .warn{fill:#2a1f10;stroke:#f59e0b;stroke-width:1.5} .bad{fill:#2a1216;stroke:#f87171;stroke-width:1.5}
      .ln{stroke:#94a3b8;stroke-width:1.6;fill:none} .dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1000" height="560" rx="18" fill="#0b1220"/>
  <text class="h" x="500" y="36" text-anchor="middle">Request flow for one HTTP request</text>
  <rect class="box" x="30" y="70" width="150" height="70" rx="10"/>
  <text class="h" x="105" y="94" text-anchor="middle">Request</text>
  <text class="s" x="105" y="114" text-anchor="middle">GET /page</text>
  <text class="s" x="105" y="131" text-anchor="middle">Host: ormantek.com</text>
  <rect class="box" x="220" y="70" width="170" height="70" rx="10"/>
  <text class="h" x="305" y="94" text-anchor="middle">1. Guard</text>
  <text class="s" x="305" y="114" text-anchor="middle">host allowlist, size,</text>
  <text class="s" x="305" y="131" text-anchor="middle">rate limit, smuggling</text>
  <rect class="box" x="430" y="70" width="170" height="70" rx="10"/>
  <text class="h" x="515" y="94" text-anchor="middle">2. Cache lookup</text>
  <text class="s" x="515" y="114" text-anchor="middle">key from normalised</text>
  <text class="s" x="515" y="131" text-anchor="middle">path and query</text>
  <rect class="ok" x="640" y="70" width="150" height="70" rx="10"/>
  <text class="h" x="715" y="94" text-anchor="middle">FRESH hit</text>
  <text class="s" x="715" y="114" text-anchor="middle">served from file</text>
  <text class="s" x="715" y="131" text-anchor="middle">cache, no origin call</text>
  <rect class="box" x="830" y="70" width="140" height="70" rx="10"/>
  <text class="h" x="900" y="94" text-anchor="middle">Response</text>
  <text class="s" x="900" y="114" text-anchor="middle">X-MirrorGate-Cache</text>
  <text class="s" x="900" y="131" text-anchor="middle">HIT / MISS / STALE</text>
  <path class="ln" d="M180 105H220" marker-end="url(#a)"/>
  <path class="ln" d="M390 105H430" marker-end="url(#a)"/>
  <path class="ln" d="M600 105H640" marker-end="url(#a)"/>
  <path class="ln" d="M790 105H830" marker-end="url(#a)"/>
  <text class="s" x="615" y="98" text-anchor="middle">hit</text>
  <rect class="box" x="430" y="200" width="170" height="70" rx="10"/>
  <text class="h" x="515" y="224" text-anchor="middle">3. Upstream fetch</text>
  <text class="s" x="515" y="244" text-anchor="middle">cURL, SSRF guard,</text>
  <text class="s" x="515" y="261" text-anchor="middle">DNS pin, timeouts</text>
  <path class="ln" d="M515 140V200" marker-end="url(#a)"/>
  <text class="s" x="528" y="176" text-anchor="start">miss or stale</text>
  <rect class="hl" x="430" y="320" width="170" height="70" rx="10"/>
  <text class="h" x="515" y="344" text-anchor="middle">4. Rewrite</text>
  <text class="s" x="515" y="364" text-anchor="middle">origin host to mirror</text>
  <text class="s" x="515" y="381" text-anchor="middle">HTML CSS JS JSON headers</text>
  <path class="ln" d="M515 270V320" marker-end="url(#a)"/>
  <text class="s" x="528" y="300" text-anchor="start">2xx / 3xx / 4xx</text>
  <rect class="box" x="640" y="320" width="150" height="70" rx="10"/>
  <text class="h" x="715" y="344" text-anchor="middle">5. Store</text>
  <text class="s" x="715" y="364" text-anchor="middle">cache write (atomic),</text>
  <text class="s" x="715" y="381" text-anchor="middle">only if cacheable</text>
  <path class="ln" d="M600 355H640" marker-end="url(#a)"/>
  <path class="ln" d="M790 355H900V140" marker-end="url(#a)"/>
  <rect class="warn" x="220" y="320" width="170" height="70" rx="10"/>
  <text class="h" x="305" y="344" text-anchor="middle">Origin failed?</text>
  <text class="s" x="305" y="364" text-anchor="middle">timeout, 5xx, DNS, TLS</text>
  <text class="s" x="305" y="381" text-anchor="middle">circuit breaker counts it</text>
  <path class="ln" d="M430 235H305V320" marker-end="url(#a)"/>
  <text class="s" x="300" y="262" text-anchor="end">error</text>
  <rect class="ok" x="30" y="450" width="200" height="76" rx="10"/>
  <text class="h" x="130" y="474" text-anchor="middle">Stale copy usable</text>
  <text class="s" x="130" y="494" text-anchor="middle">stale-if-error: serve STALE</text>
  <text class="s" x="130" y="511" text-anchor="middle">visitor sees normal page</text>
  <rect class="bad" x="280" y="450" width="200" height="76" rx="10"/>
  <text class="h" x="380" y="474" text-anchor="middle">No copy</text>
  <text class="s" x="380" y="494" text-anchor="middle">friendly 502 / 503 / 504 page</text>
  <text class="s" x="380" y="511" text-anchor="middle">request id, no origin detail</text>
  <path class="ln" d="M280 390L150 450" marker-end="url(#a)"/>
  <path class="ln" d="M330 390V450" marker-end="url(#a)"/>
  <text class="s" x="710" y="466" text-anchor="middle">SSE and large bodies stream through,</text>
  <text class="s" x="710" y="484" text-anchor="middle">never buffered, never cached.</text>
  <text class="s" x="710" y="520" text-anchor="middle">Every step is bounded by .env limits.</text>
</svg>
