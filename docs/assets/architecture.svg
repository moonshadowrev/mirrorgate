<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
  <title id="t">MirrorGate architecture</title>
  <desc id="d">Browsers reach the mirror domain B. A PHP front controller handles cache, rewriting and security and fetches the origin A over HTTPS. An optional daemon on a VPS forwards WebSocket, gRPC, TCP and UDP.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#e2e8f0}
      .h{font-size:15px;font-weight:700}
      .s{font-size:12px;fill:#94a3b8}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#cbd5e1}
      .box{fill:#111a2e;stroke:#243049;stroke-width:1.5}
      .hl{fill:#0f1f2e;stroke:url(#g);stroke-width:2}
      .ln{stroke:#94a3b8;stroke-width:1.6;fill:none}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1000" height="520" rx="18" fill="#0b1220"/>

  <rect class="box" x="30" y="60" width="150" height="110" rx="12"/>
  <text class="h" x="105" y="96" text-anchor="middle">Visitors</text>
  <text class="s" x="105" y="118" text-anchor="middle">Browsers, apps,</text>
  <text class="s" x="105" y="136" text-anchor="middle">API clients</text>
  <text class="m" x="105" y="157" text-anchor="middle">ormantek.com</text>

  <rect class="hl" x="250" y="30" width="400" height="300" rx="16"/>
  <text class="h" x="450" y="58" text-anchor="middle">Domain B: shared hosting, PHP 8.3+</text>
  <text class="s" x="450" y="76" text-anchor="middle">public/index.php + .env</text>

  <rect class="box" x="272" y="92" width="168" height="54" rx="9"/>
  <text class="h" x="356" y="115" text-anchor="middle">Request guard</text>
  <text class="s" x="356" y="134" text-anchor="middle">host, size, rate, smuggling</text>

  <rect class="box" x="460" y="92" width="168" height="54" rx="9"/>
  <text class="h" x="544" y="115" text-anchor="middle">File cache</text>
  <text class="s" x="544" y="134" text-anchor="middle">SWR, stale-if-error</text>

  <rect class="box" x="272" y="166" width="168" height="54" rx="9"/>
  <text class="h" x="356" y="189" text-anchor="middle">Upstream client</text>
  <text class="s" x="356" y="208" text-anchor="middle">cURL, SSRF guard, DNS pin</text>

  <rect class="box" x="460" y="166" width="168" height="54" rx="9"/>
  <text class="h" x="544" y="189" text-anchor="middle">Rewriter</text>
  <text class="s" x="544" y="208" text-anchor="middle">HTML CSS JSON XML headers</text>

  <rect class="box" x="272" y="240" width="356" height="64" rx="9"/>
  <text class="h" x="450" y="264" text-anchor="middle">Friendly error pages and circuit breaker</text>
  <text class="s" x="450" y="284" text-anchor="middle">timeouts, 5xx, DNS and TLS failures never reach the visitor raw</text>

  <rect class="box" x="720" y="60" width="250" height="150" rx="12"/>
  <text class="h" x="845" y="92" text-anchor="middle">Origin A (any stack)</text>
  <text class="s" x="845" y="114" text-anchor="middle">Next.js, Go, Python, ...</text>
  <text class="m" x="845" y="140" text-anchor="middle">https://overlord.team</text>
  <text class="s" x="845" y="168" text-anchor="middle">Optional: api.overlord.team</text>
  <text class="s" x="845" y="186" text-anchor="middle">as its own instance</text>

  <rect class="box" x="250" y="380" width="400" height="110" rx="14" style="stroke-dasharray:6 5"/>
  <text class="h" x="450" y="408" text-anchor="middle">Optional: bin/mirrorgate-daemon (VPS)</text>
  <text class="s" x="450" y="430" text-anchor="middle">Long-running CLI process, select() event loop</text>
  <text class="m" x="450" y="456" text-anchor="middle">WebSocket   gRPC (h2c / TLS)   TCP   UDP</text>
  <text class="s" x="450" y="476" text-anchor="middle">Loopback bind by default, target allowlist</text>

  <rect class="box" x="720" y="380" width="250" height="110" rx="12" style="stroke-dasharray:6 5"/>
  <text class="h" x="845" y="412" text-anchor="middle">Origin A sockets</text>
  <text class="s" x="845" y="436" text-anchor="middle">wss:// , tls:// , h2c, udp</text>
  <text class="s" x="845" y="456" text-anchor="middle">same host as the HTTP origin</text>

  <path class="ln" d="M180 115H250" marker-end="url(#a)"/>
  <path class="ln" d="M650 115H720" marker-end="url(#a)"/>
  <path class="ln" d="M720 160H650" marker-end="url(#a)"/>
  <path class="ln dash" d="M105 170V435H250" marker-end="url(#a)"/>
  <path class="ln dash" d="M650 435H720" marker-end="url(#a)"/>

  <text class="s" x="215" y="106" text-anchor="middle">HTTPS</text>
  <text class="s" x="685" y="106" text-anchor="middle">HTTPS</text>
  <text class="s" x="120" y="300" >ws / grpc / tcp / udp</text>
</svg>
