<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d">
  <title id="t">Friendly origin error page</title>
  <desc id="d">Illustrative rendering of the 502 page shown when the origin is unreachable and no cached copy exists. No origin address or internal detail is shown, only a status, a short message and a request id.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#e2e8f0}
      .s{font-size:14px;fill:#94a3b8}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1000" height="420" rx="18" fill="#0b1220"/>
  <rect x="30" y="30" width="940" height="360" rx="12" fill="#0f172a" stroke="#243049" stroke-width="1.5"/>
  <rect x="30" y="30" width="940" height="38" rx="12" fill="#17233b"/>
  <circle cx="52" cy="49" r="5" fill="#475569"/><circle cx="70" cy="49" r="5" fill="#475569"/><circle cx="88" cy="49" r="5" fill="#475569"/>
  <text class="m" x="112" y="53">https://overload.ir/pricing</text>
  <rect x="320" y="110" width="360" height="230" rx="14" fill="#111a2e" stroke="#243049" stroke-width="1.5"/>
  <text x="500" y="168" text-anchor="middle" style="font-size:40px;font-weight:800;fill:#2dd4bf">502</text>
  <text x="500" y="204" text-anchor="middle" style="font-size:18px;font-weight:700">Temporarily unavailable</text>
  <text class="s" x="500" y="234" text-anchor="middle">The source site did not answer in time.</text>
  <text class="s" x="500" y="256" text-anchor="middle">Please try again in a moment.</text>
  <text class="m" x="500" y="300" text-anchor="middle">Request ID: 9f3c1a07b2d84e55</text>
  <text class="m" x="500" y="370" text-anchor="middle">Illustrative rendering. Shown only when no cached copy can be served.</text>
</svg>
