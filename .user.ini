; MirrorGate root-shim layout (docroot = project root, no public/ directory in the docroot).
; Read by PHP-FPM / FastCGI / CGI for the root index.php shim (cached for user_ini.cache_ttl,
; 300 seconds by default). Required so php://input carries the raw request body of form and
; multipart uploads. With mod_php the root .htaccess sets the same value.
enable_post_data_reading = 0
