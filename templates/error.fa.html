<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>{{status}} {{title}}</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f7;
  --fg: #1f2328;
  --muted: #5b6168;
  --line: #d4d7db;
  --card: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a;
    --fg: #e8eaed;
    --muted: #9aa0a6;
    --line: #34383d;
    --card: #1d2024;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: var(--bg);
  color: var(--fg);
  font-family: Vazirmatn, Vazir, "Segoe UI", Tahoma, "Noto Naskh Arabic", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.8;
  letter-spacing: 0;
}
main {
  width: 100%;
  max-width: 34rem;
  padding: 32px 28px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  text-align: center;
}
.code {
  margin: 0 0 4px;
  font-size: 3.5rem;
  font-weight: 700;
  line-height: 1.2;
  color: var(--muted);
}
h1 { margin: 0 0 12px; font-size: 1.4rem; font-weight: 700; line-height: 1.5; }
.msg { margin: 0 0 24px; color: var(--muted); overflow-wrap: anywhere; }
.ref { margin: 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); }
.ref code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; user-select: all; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
<p class="code" dir="ltr">{{status}}</p>
<h1>{{title}}</h1>
<p class="msg">{{message}}</p>
<p class="ref">شناسه درخواست: <bdi><code dir="ltr">{{request_id}}</code></bdi></p>
</main>
</body>
</html>
