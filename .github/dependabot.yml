version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # PHPUnit 13+ requires PHP 8.4; MirrorGate supports PHP 8.3+.
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]
