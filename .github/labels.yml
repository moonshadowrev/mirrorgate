# Label definitions. Apply with a label-sync tool of your choice (for example
# `gh label create` or github-label-sync); no workflow is shipped.
- name: bug
  color: d73a4a
  description: Something is not working as documented
- name: enhancement
  color: a2eeef
  description: New feature or improvement
- name: question
  color: d876e3
  description: Usage question or clarification
- name: security
  color: b60205
  description: Security-related change (report vulnerabilities privately)
- name: documentation
  color: 0075ca
  description: Documentation changes
- name: dependencies
  color: 0366d6
  description: Dependency updates
- name: daemon
  color: 5319e7
  description: CLI daemon (WebSocket, gRPC, TCP, UDP forwarding)
- name: proxy
  color: 1d76db
  description: HTTP proxy, rewriting, or caching behavior
- name: shared-hosting
  color: fbca04
  description: Shared hosting or deployment compatibility
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: 008672
  description: Extra attention is needed
- name: needs-triage
  color: ededed
  description: Awaiting maintainer review
- name: wontfix
  color: ffffff
  description: This will not be worked on
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
